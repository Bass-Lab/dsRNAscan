name: CI Tests

on:
  push:
    branches: [main, rust-core]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-13]
        python-version: ['3.9', '3.12']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install from source (builds the compiled engine with Rust)
      run: pip install .

    - name: Compiled engine and legacy einverted pipeline agree
      run: |
        dsrnascan --version
        FA=tests/data/chr19_1000001-1100000.fa
        dsrnascan $FA --no-ml -c 2 --output-dir out_core
        dsrnascan $FA --no-ml -c 2 --legacy-einverted --output-dir out_legacy
        python - <<'EOF'
        import glob, pandas as pd
        k = ['Strand', 'i_start', 'i_end', 'j_start', 'j_end']
        core, legacy = (pd.read_csv(glob.glob(f'{d}/*_merged_results.txt')[0], sep='\t') for d in ('out_core', 'out_legacy'))
        a, b = set(map(tuple, core[k].to_numpy())), set(map(tuple, legacy[k].to_numpy()))
        print(f'core {len(a)} dsRNAs, legacy {len(b)} dsRNAs, identical: {a == b}')
        assert len(a) > 0 and a == b
        EOF

    - name: --v1 runs
      run: |
        dsrnascan tests/data/chr19_1000001-1100000.fa --no-ml -c 2 --v1 --output-dir out_v1
        test "$(tail -n +2 out_v1/*_merged_results.txt | wc -l)" -gt 0
