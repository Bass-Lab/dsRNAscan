name: CI Tests

# Manual only: run from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.9', '3.12']

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install from source (builds the compiled engine with Rust)
      run: pip install .

    - name: Results match the expected dsRNAs
      run: |
        dsrnascan --version
        dsrnascan tests/data/chr19_1000001-1100000.fa --no-ml -c 2 --output-dir out
        python - <<'EOF'
        import glob, pandas as pd
        cols = ['Strand', 'i_start', 'i_end', 'j_start', 'j_end', 'dG(kcal/mol)', 'percent_paired', 'structure']
        got = pd.read_csv(glob.glob('out/*.dsrnas.txt')[0], sep='\t')[cols]
        exp = pd.read_csv('tests/data/chr19_1000001-1100000.expected.tsv', sep='\t')
        a, b = set(map(tuple, got.astype(str).to_numpy())), set(map(tuple, exp.astype(str).to_numpy()))
        print(f'{len(a)} dsRNAs, expected {len(b)}, identical: {a == b}')
        assert a == b
        EOF

    - name: ML scoring runs
      run: |
        dsrnascan tests/data/chr19_1000001-1100000.fa -c 2 --output-dir out_ml
        grep -q likely_edited out_ml/*.dsrnas.txt
