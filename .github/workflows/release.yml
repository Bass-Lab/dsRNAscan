# Build dsrnascan wheels (Python package + compiled engine) for every platform and test them.
# Manual only; download the artifacts and upload them with twine.
name: Build wheels

on:
  workflow_dispatch:

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.manylinux }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-14, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Install each native wheel and run a small scan.
  test:
    needs: wheels
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheel: wheel-ubuntu-latest-x86_64-auto }
          - { os: macos-14, wheel: wheel-macos-14-aarch64-auto }
          - { os: windows-latest, wheel: wheel-windows-latest-x64-auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: dist
      - name: Install and scan
        shell: bash
        run: |
          pip install dist/*.whl
          dsrnascan --version
          dsrnascan tests/data/chr19_1000001-1100000.fa --no-ml -c 2 --output-dir out
          python -c "import glob, pandas as pd; assert len(pd.read_parquet(glob.glob('out/*.dsrnas.parquet')[0])) > 0"
